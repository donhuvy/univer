[package]
name = "bkit-sheets"
version = "1.0.0"
description = "BKIT Sheets - Phan mem bang tinh chuyen nghiep"
authors = ["BKIT.VN <support@bkit.vn>"]
edition = "2021"

[lib]
name = "bkit_sheets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
